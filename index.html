<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bamboo Forest Flappy Bird</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   
   <!-- Google Fonts-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unlock&display=swap" rel="stylesheet">
   <style>


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            background: url('https://iili.io/3XO51us.md.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
        }

        .page-section {
            display: none;
            min-height: 100vh;
            padding-top: 80px;
        }
        
        .page-section.active {
            display: block;
        }

        .game-canvas {
            border: 3px solid #2E7D32;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.114);
        }

        .navbar {
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background: rgba(46, 125, 50, 0.95) !important;
        }

        .instruction-card {
            max-width: 600px;
            margin: 2rem auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.103);
        }

        .leaderboard-table {
            max-width: 800px;
            margin: 2rem auto;
            background: rgba(255, 255, 255, 0.086);
            border-radius: 10px;
            overflow: hidden;
        }

        #gameOver {
            background: rgba(46, 125, 50, 0.95);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .dark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
 


    </style>
</head>
<body style="font-family:Unlock">
    <section id="home" class="page-section active">
        <div class="container text-center">
            <div class="py-5">
                <h1 class="display-4 mb-4 text-white">Welcome to Flappy Bamboo!</h1>

                <!-- Add Image Section -->
            <div class="row justify-content-center mb-4">
                <div class="col-md-8">
                    <div class="game-image-container">
                        <img src="../image/download__6_-removebg-preview.png" 
                             alt="Flappy Bamboo Game Preview" 
                             class="img-fluid rounded ">
                        <small class="image-caption"></small>
                    </div>
                </div>
            </div>
                <div class="instruction-card card">
                    <div class="card-body">
                        <h2 class="card-title mb-4">How to Play</h2>
                        <div class="row g-4">
                            <div class="col-md-6" style="color: rgba(29, 84, 12, 0.797);">
                                <div class="h-100 p-3  rounded">
                                    <h3>Objective</h3>
                                    <p>Guide the panda bird through bamboo obstacles!</p>
                                </div>
                            </div>
                            <div class="col-md-6" style="color: rgba(29, 84, 12, 0.797);">
                                <div class="h-100 p-3  rounded">
                                    <h3> Controls</h3>
                                    <ul class="list-unstyled">
                                        <li>Click/Tap: Make the bird flap</li>
                                        <li>Spacebar: Flap (desktop)</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                     <a href="File/Game.html"><button id="startGame" class="btn btn-success btn-lg mt-4 px-5">
                        Start Game!</button></a>   
                        
                    </div>
                </div>
            </div>
        </div>
    </section>
    <audio id="bgMusic" autoplay loop>
        <source src="Audio/maringa-conga-246609.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
</body>
</html>
